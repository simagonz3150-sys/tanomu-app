<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="発注集計">
<meta name="application-name" content="発注集計">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="icon" type="image/png" href="favicon.png?v=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#faf7f5">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>タノム発注集計</title>
<style>
  html,body{margin:0;height:100%;background:#faf7f5;overflow:hidden}
  body{padding-top:env(safe-area-inset-top)}
  iframe{display:block;border:0;width:100%;height:100%}
  #load{position:fixed;inset:0;display:grid;place-items:center;color:#8a7f79;font:14px "Hiragino Sans",system-ui,sans-serif;pointer-events:none}
  #toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#3b302b;color:#fff;padding:12px 16px;border-radius:10px;font:14px "Hiragino Sans",system-ui,sans-serif;display:none;max-width:90%}
  #toast a{color:#ffd2bf;font-weight:600}
</style>
</head>
<body>
<div id="load">読み込み中…</div>
<iframe id="app" allow="web-share; clipboard-write" src="https://script.google.com/macros/s/AKfycbxR4733eohH4yfv77zwMb7zYMw6aT41k9YzNxi0XqPwIDbotendVeS160EOfQHzcYUKDw/exec?app=1"></iframe>
<div id="toast"></div>
<script>
document.getElementById("app").addEventListener("load", ()=>{ document.getElementById("load").remove(); });
const toast = document.getElementById("toast");
function save(file){
  const url = URL.createObjectURL(file);
  const a = document.createElement("a"); a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  toast.innerHTML = `PDFを保存しました。<a href="${url}" target="_blank" rel="noopener">開く</a>`;
  toast.style.display = "block"; setTimeout(()=>{ toast.style.display = "none"; }, 6000);
}
window.addEventListener("message", e=>{
  if(!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin)) return;
  const d = e.data; if(!d) return;
  // 合言葉をこのページに覚えておく(ホーム画面のアイコンから開くたびに入力しなくてよいように)
  if(d.type === "tanomu-get-key"){ let k = ""; try{ k = localStorage.getItem("tanomu_key") || ""; }catch(_){} if(e.source) e.source.postMessage({type:"tanomu-key", key:k}, e.origin); return; }
  if(d.type === "tanomu-set-key"){ try{ if(d.key) localStorage.setItem("tanomu_key", String(d.key)); else localStorage.removeItem("tanomu_key"); }catch(_){} return; }
  if(d.type !== "tanomu-pdf" || !d.buf) return;
  const file = new File([d.buf], d.name || "発注集計.pdf", {type:"application/pdf"});
  if(d.mode === "share" && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:file.name}).catch(err=>{ if(err && err.name !== "AbortError") save(file); });
  } else save(file);
});
</script>
<script>
// アプリの入室IDをこのページ（ホーム画面のアプリ）側に覚えておき、次から自動で入れる
window.addEventListener("message", function(e){
  var h; try{ h = new URL(e.origin).hostname; }catch(_){ return; }
  if(!/\.googleusercontent\.com$/.test(h)) return;
  var d = e.data || {}; if(!d.k || typeof d.type !== "string" || d.type.indexOf("appid-") !== 0) return;
  var key = "appid:" + d.k;
  if(d.type === "appid-get"){
    var v = ""; try{ v = localStorage.getItem(key) || ""; }catch(_){}
    if(e.source) e.source.postMessage({type:"appid-val", k:d.k, v:v}, e.origin);
  } else if(d.type === "appid-set" && d.v){
    try{ localStorage.setItem(key, String(d.v)); }catch(_){}
  } else if(d.type === "appid-clear"){
    try{ localStorage.removeItem(key); }catch(_){}
  }
});
</script>
</body>
</html>
